
name: Publish asteria-ssg

on:
  push:
    tags:
      - "asteria-ssg-*"

  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/asteria-ssg

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build
        run: pip install build

      - name: Build package
        run: |
          cd asteria
          python -m build

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: asteria/dist/

      - name: Upload files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: asteria/dist/*
          overwrite_files: true
