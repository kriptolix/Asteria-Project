
name: Upload Release Assets

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing release files
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ inputs.package-dir }}/*
