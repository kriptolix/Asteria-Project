[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria"
version = "0.1.0"
description = "SSG (Static Site Generator) Python baseado exclusivamente em documentos ODT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "odt2web>=1.0",
]

[project.optional-dependencies]
# Automatic rebuild + live reload in `asteria serve` (pulls in a Rust extension).
watch = ["watchfiles>=0.21"]

[project.scripts]
asteria = "asteria.cli:main"

[tool.setuptools.packages.find]
include = ["asteria*"]

[tool.setuptools.package-data]
asteria = ["themes/**/*"]