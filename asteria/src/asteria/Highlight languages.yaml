# Language definitions for basic syntax highlighting in Asteria (see
# asteria/highlight.py). This is configuration data, not code: to add a
# language or extend an existing one, edit this file.
#
# A project can override or supplement these settings by creating
# `source/highlight.yaml` with the same structure—a "deep merge" is
# performed over this file (following the same logic as `theme.params`
# applied to `theme.yaml`; see `config.deep_merge` / `theme_config.load_theme_config`).
# For example, to add a missing keyword:
#
#   python:
#     keywords: [match, case]   ​​# Does this merge with existing keywords? NO —
#                                 # a deep merge replaces entire lists;
#                                 # it does not concatenate them. You must
#                                 # copy the full list, even if just adding
#                                 # one word.
#
# Fields per language (all are optional, except for the key name itself,
# which must match the string following "language-" in the class
# generated by `odt2web`):
#   aliases:          Other "language-X" classes that point to this
#                      same definition (e.g., "js" -> "javascript").
#   line_comment:      Marker for single-line comments (e.g., "#", "//").
#   block_comments:    A list of [open, close] pairs (e.g., ["/*", "*/"]).
#   triple_quotes:     Triple-quoted strings treated as a single string
#                      entity (as in Python).
#   assignment_style:  Setting this to "equals" enables a heuristic where
#                      an identifier at the start of a line, followed by
#                      a standalone "=", is treated as a variable assignment.
#                      Omit this for languages ​​where this does not apply
#                      (e.g., YAML uses ":", SQL has no assignment operator, etc.).
#   keywords:          A list of keywords (case-sensitive).

python:
  aliases: [py]
  line_comment: "#"
  triple_quotes: ['"""', "'''"]
  assignment_style: equals
  keywords:
    - and
    - as
    - assert
    - async
    - await
    - break
    - class
    - continue
    - def
    - del
    - elif
    - else
    - except
    - finally
    - for
    - from
    - global
    - if
    - import
    - in
    - is
    - lambda
    - nonlocal
    - not
    - or
    - pass
    - raise
    - return
    - try
    - while
    - with
    - yield
    - None
    - True
    - False
    - self

javascript:
  aliases: [js, jsx, typescript, ts, tsx]
  line_comment: "//"
  block_comments:
    - ["/*", "*/"]
  assignment_style: equals
  keywords:
    - async
    - await
    - break
    - case
    - catch
    - class
    - const
    - continue
    - debugger
    - default
    - delete
    - do
    - else
    - enum
    - export
    - extends
    - finally
    - for
    - function
    - if
    - implements
    - import
    - in
    - instanceof
    - interface
    - let
    - new
    - of
    - package
    - private
    - protected
    - public
    - return
    - static
    - super
    - switch
    - this
    - throw
    - try
    - type
    - typeof
    - undefined
    - var
    - void
    - while
    - yield
    - null
    - true
    - false

html:
  aliases: [htm, xml]
  block_comments:
    - ["<!--", "-->"]

css:
  aliases: [scss, less]
  block_comments:
    - ["/*", "*/"]

json:
  keywords: [true, false, null]

bash:
  aliases: [sh, shell, zsh]
  line_comment: "#"
  assignment_style: equals
  keywords:
    - case
    - do
    - done
    - elif
    - else
    - esac
    - exit
    - export
    - fi
    - for
    - function
    - if
    - in
    - local
    - return
    - then
    - while

yaml:
  aliases: [yml]
  line_comment: "#"
  keywords: [true, false, null, yes, no, on, off]

sql:
  line_comment: "--"
  block_comments:
    - ["/*", "*/"]
  keywords:
    - ALL
    - ALTER
    - AND
    - AS
    - BETWEEN
    - BY
    - CASE
    - CREATE
    - DEFAULT
    - DELETE
    - DISTINCT
    - DROP
    - END
    - EXISTS
    - FOREIGN
    - FROM
    - GROUP
    - HAVING
    - IN
    - INNER
    - INSERT
    - INTO
    - JOIN
    - KEY
    - LEFT
    - LIKE
    - LIMIT
    - NOT
    - NULL
    - OFFSET
    - ON
    - OR
    - ORDER
    - OUTER
    - PRIMARY
    - REFERENCES
    - RIGHT
    - SELECT
    - SET
    - TABLE
    - THEN
    - UNION
    - UPDATE
    - VALUES
    - WHEN
    - WHERE