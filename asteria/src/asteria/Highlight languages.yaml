# Built-in language definitions for the basic syntax highlighting (see
# asteria/highlight.py). This is configuration data, not code: it lives inside
# the package and applies to every project, whatever its theme.
#
# A project can add or change languages by creating `source/highlight.yaml`
# with the same structure. It is merged over this file language by language
# (see `config.deep_merge`): keys you don't mention are kept, but a list you
# do give REPLACES the built-in one instead of being added to it. So to add a
# single keyword to python you must copy the whole `keywords` list:
#
#   python:
#     keywords: [and, as, assert, ..., match, case]
#
# Fields per language (all optional, except for the name itself, which must be
# lowercase and match the text after "language-" in the class that `odt2web`
# puts on the code block):
#   aliases:           Other "language-X" names that point to this same
#                      definition (e.g. "js" -> "javascript").
#   line_comment:      Marker for single-line comments (e.g. "#", "//").
#   block_comments:    A list of [open, close] pairs (e.g. ["/*", "*/"]).
#   triple_quotes:     Triple-quoted strings treated as a single string
#                      entity (as in Python).
#   assignment_style:  Setting this to "equals" enables a heuristic where an
#                      identifier at the start of a line, followed by a
#                      standalone "=", is treated as a variable assignment.
#                      Omit it for languages where this doesn't apply (YAML
#                      uses ":", SQL has no assignment operator, etc.).
#   keywords:          A list of keywords (case-sensitive: the SQL list below
#                      is uppercase, so lowercase `select` isn't highlighted).
#                      Quote every word that YAML would read as a boolean or
#                      null -- "true", "false", "null", "yes", "no", "on",
#                      "off", "NULL", "ON" -- otherwise it is not the text you
#                      meant, and Asteria stops with an error.

python:
  aliases: [py]
  line_comment: "#"
  triple_quotes: ['"""', "'''"]
  assignment_style: equals
  keywords:
    - and
    - as
    - assert
    - async
    - await
    - break
    - class
    - continue
    - def
    - del
    - elif
    - else
    - except
    - finally
    - for
    - from
    - global
    - if
    - import
    - in
    - is
    - lambda
    - nonlocal
    - not
    - or
    - pass
    - raise
    - return
    - try
    - while
    - with
    - yield
    - None
    - "True"
    - "False"
    - self

javascript:
  aliases: [js, jsx, typescript, ts, tsx]
  line_comment: "//"
  block_comments:
    - ["/*", "*/"]
  assignment_style: equals
  keywords:
    - async
    - await
    - break
    - case
    - catch
    - class
    - const
    - continue
    - debugger
    - default
    - delete
    - do
    - else
    - enum
    - export
    - extends
    - finally
    - for
    - function
    - if
    - implements
    - import
    - in
    - instanceof
    - interface
    - let
    - new
    - of
    - package
    - private
    - protected
    - public
    - return
    - static
    - super
    - switch
    - this
    - throw
    - try
    - type
    - typeof
    - undefined
    - var
    - void
    - while
    - yield
    - "null"
    - "true"
    - "false"

html:
  aliases: [htm, xml]
  block_comments:
    - ["<!--", "-->"]

css:
  aliases: [scss, less]
  block_comments:
    - ["/*", "*/"]

json:
  keywords: ["true", "false", "null"]

bash:
  aliases: [sh, shell, zsh]
  line_comment: "#"
  assignment_style: equals
  keywords:
    - case
    - do
    - done
    - elif
    - else
    - esac
    - exit
    - export
    - fi
    - for
    - function
    - if
    - in
    - local
    - return
    - then
    - while

yaml:
  aliases: [yml]
  line_comment: "#"
  keywords: ["true", "false", "null", "yes", "no", "on", "off"]

sql:
  line_comment: "--"
  block_comments:
    - ["/*", "*/"]
  keywords:
    - ALL
    - ALTER
    - AND
    - AS
    - BETWEEN
    - BY
    - CASE
    - CREATE
    - DEFAULT
    - DELETE
    - DISTINCT
    - DROP
    - END
    - EXISTS
    - FOREIGN
    - FROM
    - GROUP
    - HAVING
    - IN
    - INNER
    - INSERT
    - INTO
    - JOIN
    - KEY
    - LEFT
    - LIKE
    - LIMIT
    - NOT
    - "NULL"
    - OFFSET
    - "ON"
    - OR
    - ORDER
    - OUTER
    - PRIMARY
    - REFERENCES
    - RIGHT
    - SELECT
    - SET
    - TABLE
    - THEN
    - UNION
    - UPDATE
    - VALUES
    - WHEN
    - WHERE