<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <link rel="stylesheet" href="./search.css">
    <script src="./search.js" defer></script>
</head>

<body>

    <!-- data-search-header lets search.js find the header reliably even
         if this markup is dropped into a theme whose header isn't a
         plain <header> element (e.g. a <div class="site-header">). -->
    <header data-search-header>

        <strong>Meu site</strong>

        <!--
            data-index-url, data-min-length and data-max-results are
            optional; see the top of search.js for defaults and for the
            search-index.json shape expected by normalizeEntry().
            Example:
            <form id="search-form" role="search" data-index-url="/search-index.json">
        -->
        <form id="search-form" role="search">

            <label for="search-input" class="sr-only">
                Buscar
            </label>

            <input
                id="search-input"
                type="search"
                placeholder="Buscar..."
                autocomplete="off"
            >

            <button type="submit">
                🔍 Buscar
            </button>

        </form>

    </header>


    <main>
        <h1>Conteúdo da página</h1>
        <p>Conteúdo normal do site.</p>
    </main>


    <div id="search-overlay" class="search-overlay">

        <div
            id="search-window"
            class="search-window"
            aria-label="Resultados da busca"
        >

            <div class="search-window__header">
                <h2>Resultados</h2>
                <button type="button" class="search-window__close" id="search-close">
                    <span aria-hidden="true">&times;</span>
                    <span class="sr-only">Fechar</span>
                </button>
            </div>

            <!-- Updated by search.js. aria-live announces changes to
                 screen readers without moving focus away from the input,
                 so the user can keep typing uninterrupted. -->
            <p id="search-status" class="search-status" role="status" aria-live="polite"></p>

            <!-- Populated by search.js; starts empty. -->
            <ul id="search-results" class="search-results"></ul>

        </div>

    </div>

</body>
</html>
