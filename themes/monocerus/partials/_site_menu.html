{% macro render_site_menu(menu, current_path) %}
<button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
    ☰
</button>
<nav class="site-menu">
    <ul>
        {% for item in menu %}
        <li><a href="{{ item.url }}" class="{{ 'active' if menu_item_active(item, current_path) else '' }}">{{ item.title }}</a></li>
        {% endfor %}
    </ul>
</nav>
{% endmacro %}
