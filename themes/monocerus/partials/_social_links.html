{% macro render_social_links(links) %}
{% if links %}
<div class="social-links">
    {% for item in links %}
    <a href="{{ item.url }}" class="social-link" aria-label="{{ item.label }}" title="{{ item.label }}"
        rel="me noopener">
        <img src="{{ asset('/images/' ~ (item.platform | lower) ~ '.svg') }}" alt="{{ item.label }}">
    </a>
    {% endfor %}
</div>
{% endif %}
{% endmacro %}
