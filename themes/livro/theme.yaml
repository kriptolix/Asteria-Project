# Namespace próprio do tema "livro" — exposto aos templates como
# theme.<chave>. Toda chave que base.html/page.html/etc. usam precisa
# estar declarada aqui (mesmo que vazia) — o Asteria não faz fallback
# silencioso: uma chave usada no template e ausente aqui quebra o build.
#
# Este arquivo é copiado junto quando você roda `asteria new` (ou copia
# este tema manualmente) — edite à vontade no seu projeto.

sidebar_toc: true
default_variant: light

# Aparece abaixo do título do site no cabeçalho, se não vazio.
subtitulo: ""

# Menu do cabeçalho — 'page' é o id de uma página (mesma convenção de
# [[id]]), ou a palavra especial 'blog'.
menu: []

# Navegação hierárquica da sidebar (estilo nav: do MkDocs Material) — veja
# o README do Asteria para o formato completo (seções, título automático
# do documento, convenção de página-índice de seção).
nav: []

# Links de redes sociais no rodapé (ícones circulares). Plataformas
# reconhecidas: github, gitlab, twitter, x, mastodon, linkedin, youtube,
# instagram, facebook, discord, telegram, rss, email — outras caem num
# monograma genérico.
social: []
