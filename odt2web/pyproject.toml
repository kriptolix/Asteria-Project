[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odt2web"
version = "0.1.0"
description = "Converte documentos OpenDocument Text (.odt) em HTML semantico + CSS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
odt2web = "odt2web.cli:main"

[tool.setuptools.packages.find]
include = ["odt2web*"]
